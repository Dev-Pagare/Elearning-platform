<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | E-Learning</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0a1628 0%,#0d1f3c 50%,#0f2a4a 100%);position:relative;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;}
.orb-1{width:500px;height:500px;background:rgba(99,102,241,0.15);top:-100px;right:-100px;}
.orb-2{width:400px;height:400px;background:rgba(139,92,246,0.1);bottom:-80px;left:-80px;}
.card{position:relative;z-index:2;width:100%;max-width:420px;background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:2.5rem;
  backdrop-filter:blur(20px);box-shadow:0 25px 60px rgba(0,0,0,0.5);}
.logo{display:flex;align-items:center;gap:0.75rem;justify-content:center;margin-bottom:2rem;}
.logo-icon{width:48px;height:48px;background:linear-gradient(135deg,#6366f1,#8b5cf6);
  border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:white;}
.logo-text{font-family:'Space Grotesk',sans-serif;font-size:1.2rem;font-weight:700;color:white;}
.logo-text span{color:#a5b4fc;}
h1{font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:700;
  color:white;text-align:center;margin-bottom:0.4rem;}
.subtitle{font-size:0.85rem;color:rgba(255,255,255,0.5);text-align:center;margin-bottom:2rem;}
.field{margin-bottom:1.25rem;}
.field label{display:block;font-size:0.78rem;font-weight:700;text-transform:uppercase;
  letter-spacing:0.8px;color:rgba(255,255,255,0.5);margin-bottom:0.5rem;}
.field .input-wrap{position:relative;}
.field .input-wrap i{position:absolute;left:1rem;top:50%;transform:translateY(-50%);
  color:rgba(255,255,255,0.3);font-size:0.95rem;pointer-events:none;}
.field input{width:100%;padding:0.85rem 1rem 0.85rem 2.75rem;
  background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.12);
  border-radius:12px;color:white;font-family:'Inter',sans-serif;font-size:0.9rem;
  outline:none;transition:border-color 0.2s,background 0.2s;}
.field input::placeholder{color:rgba(255,255,255,0.25);}
.field input:focus{border-color:#6366f1;background:rgba(99,102,241,0.08);}
.btn-login{width:100%;padding:0.9rem;background:linear-gradient(135deg,#6366f1,#8b5cf6);
  color:white;border:none;border-radius:12px;font-family:'Inter',sans-serif;
  font-size:0.95rem;font-weight:700;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:0.5rem;transition:all 0.25s;
  box-shadow:0 4px 20px rgba(99,102,241,0.35);margin-top:0.5rem;}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(99,102,241,0.5);}
.error-box{background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);
  border-radius:10px;padding:0.85rem 1rem;margin-bottom:1.25rem;
  display:flex;align-items:center;gap:0.6rem;color:#fca5a5;font-size:0.84rem;}
.back-link{text-align:center;margin-top:1.5rem;font-size:0.82rem;color:rgba(255,255,255,0.35);}
.back-link a{color:#a5b4fc;text-decoration:none;font-weight:600;}
.back-link a:hover{color:#6366f1;}
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="card">
  <div class="logo">
    <div class="logo-icon"><i class="bi bi-shield-lock-fill"></i></div>
    <div class="logo-text">E-<span>Learning</span></div>
  </div>
  <h1>Admin Login</h1>
  <p class="subtitle">Sign in to access the admin panel</p>

  {% if error %}
  <div class="error-box">
    <i class="bi bi-exclamation-triangle-fill"></i> {{ error }}
  </div>
  {% endif %}

  <form method="POST" action="/admin/login/">
    <div class="field">
      <label>Username</label>
      <div class="input-wrap">
        <i class="bi bi-person-fill"></i>
        <input type="text" name="username" placeholder="Enter admin username" autocomplete="username" required>
      </div>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <i class="bi bi-lock-fill"></i>
        <input type="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
      </div>
    </div>
    <button type="submit" class="btn-login">
      <i class="bi bi-box-arrow-in-right"></i> Sign In to Admin
    </button>
  </form>

  <div class="back-link">
    <a href="/"><i class="bi bi-arrow-left"></i> Back to Website</a>
  </div>
</div>
</body>
</html>
