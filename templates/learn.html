{% extends 'nav.html' %}
{% load static %}
{% block content %}
<div style="padding-top: var(--nav-height); min-height:100vh; background:var(--bg); display:flex;">

    
    <div class="learn-sidebar" id="learnSidebar">
        <div class="learn-sidebar-header">
            <h3 id="sidebar-course-name">Loading...</h3>
            
            <div class="sidebar-progress-wrap">
                <div class="sidebar-progress-bar" id="sidebarProgressBar" style="width:0%"></div>
            </div>
            <div class="sidebar-progress-text">
                <span id="progressText">0% Complete</span>
                <button class="cert-btn" id="certBtn" onclick="showCertificate()" style="display:none">
                    <i class="bi bi-award-fill"></i> Certificate
                </button>
            </div>
        </div>
        <div id="sidebar-chapters"></div>
    </div>

    
    <div class="learn-main" id="learnMain">
        <div class="learn-topbar">
            <button class="sidebar-toggle" onclick="toggleSidebar()">
                <i class="bi bi-list"></i>
            </button>
            <span id="current-lesson-title">Select a lesson</span>
            <div style="margin-left:auto;display:flex;align-items:center;gap:0.75rem;">
                <span id="topProgressText" style="font-size:0.8rem;color:var(--text-muted);font-weight:600;"></span>
            </div>
        </div>

        <div class="learn-content-area" id="lessonContent">
            <div class="learn-welcome">
                <div style="font-size:3rem;margin-bottom:1rem;">📚</div>
                <h2>Welcome to the Course!</h2>
                <p>Select a lesson from the sidebar to start learning.</p>
            </div>
        </div>
    </div>
</div>


<div id="quizModal" class="quiz-modal" onclick="handleModalClick(event)">
    <div class="quiz-modal-inner" id="quizModalInner">
        <button class="quiz-modal-close" onclick="closeQuiz()"><i class="bi bi-x-lg"></i></button>
        <div id="quizContent"></div>
    </div>
</div>


<div id="certModal" class="quiz-modal" onclick="handleCertModalClick(event)">
    <div class="quiz-modal-inner" style="max-width:720px;padding:0;overflow:hidden;">
        <button class="quiz-modal-close" onclick="closeCertificate()"><i class="bi bi-x-lg"></i></button>
        <div id="certContent"></div>
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const courseId = params.get('course_id');
const token = localStorage.getItem('token');
let allLessons = [];
let currentLessonIndex = 0;
let _quizData = null;
let _quizAnswers = {};
let completedLessons = new Set();
let _certId = null;

function getUsername() {
    try {
        const tok = localStorage.getItem('token');
        if (!tok) return '';
        return JSON.parse(atob(tok.split('.')[1])).username || '';
    } catch(e) { return ''; }
}

window.onload = async function() {
    if (!token) { window.location.href = "{% url 'login_page' %}"; return; }

    const accessRes = await fetch('/check_access/', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` },
        body: new URLSearchParams({ course_id: courseId })
    });
    const accessData = await accessRes.json();

    const courseRes = await fetch(`/get_course/?course_id=${courseId}`);
    const courseData = await courseRes.json();
    document.getElementById('sidebar-course-name').textContent = courseData.course.course_name;

    if (!accessData.has_access) { showNoAccess(accessData.status, courseId); return; }

    const contentRes = await fetch(`/get_course_content/?course_id=${courseId}`);
    const contentData = await contentRes.json();
    renderSidebar(contentData.chapters);

    loadProgress();
};

async function loadProgress() {
    const uname = getUsername();
    const res = await fetch(`/get_progress/?username=${uname}&course_id=${courseId}`);
    const data = await res.json();
    completedLessons = new Set(data.completed_lesson_ids);
    _certId = data.certificate_id;
    updateProgressUI(data.percentage);
    updateLessonChecks();
    if (data.certificate_id) {
        document.getElementById('certBtn').style.display = 'flex';
    }
}

function updateProgressUI(pct) {
    document.getElementById('sidebarProgressBar').style.width = pct + '%';
    document.getElementById('progressText').textContent = pct + '% Complete';
    document.getElementById('topProgressText').textContent = pct + '% Complete';
}

function updateLessonChecks() {
    allLessons.forEach((lesson, idx) => {
        const el = document.getElementById(`lesson-item-${idx}`);
        if (!el) return;
        const check = el.querySelector('.lesson-check');
        if (completedLessons.has(lesson.id)) {
            el.classList.add('done');
            if (check) check.innerHTML = '<i class="bi bi-check-circle-fill"></i>';
        } else {
            el.classList.remove('done');
            if (check) check.innerHTML = '<i class="bi bi-circle"></i>';
        }
    });
}

function showNoAccess(status, courseId) {
    document.getElementById('sidebar-chapters').innerHTML =
        `<div style="padding:1.5rem;color:rgba(255,255,255,0.4);font-size:0.82rem;">No content available</div>`;
    const main = document.getElementById('lessonContent');
    if (status === 'pending') {
        main.innerHTML = `
        <div class="no-access-box">
            <div class="lock-icon"><i class="bi bi-hourglass-split"></i></div>
            <h3 style="font-family:var(--font-display);color:var(--dark);margin-bottom:0.5rem;">Request Pending</h3>
            <p style="color:var(--text-muted);margin-bottom:1.5rem;">Your enrollment request is under review.</p>
            <div class="pending-box">
                <i class="bi bi-clock" style="color:#f59e0b;font-size:1.5rem;margin-bottom:0.5rem;display:block;"></i>
                <p style="margin:0;font-size:0.88rem;color:#92400e;font-weight:600;">Waiting for admin approval</p>
            </div>
            <a href="/" style="display:inline-block;margin-top:1.5rem;" class="btn-primary-lg"><i class="bi bi-arrow-left"></i> Back to Courses</a>
        </div>`;
    } else {
        main.innerHTML = `
        <div class="no-access-box">
            <div class="lock-icon"><i class="bi bi-lock-fill"></i></div>
            <h3 style="font-family:var(--font-display);color:var(--dark);margin-bottom:0.5rem;">Access Required</h3>
            <p style="color:var(--text-muted);margin-bottom:1.5rem;">You need to enroll in this course to access the content.</p>
            <a href="/course_description_page/?course_id=${courseId}" class="btn-primary-lg">Enroll Now <i class="bi bi-arrow-right"></i></a>
        </div>`;
    }
}

function renderSidebar(chapters) {
    const sidebar = document.getElementById('sidebar-chapters');
    sidebar.innerHTML = '';
    allLessons = [];
    chapters.forEach((chapter) => {
        const chDiv = document.createElement('div');
        chDiv.className = 'chapter-item';
        const lessonsHTML = chapter.lessons.map((lesson) => {
            const idx = allLessons.length;
            allLessons.push(lesson);
            return `<div class="lesson-item" id="lesson-item-${idx}" onclick="loadLesson(${idx})">
                <i class="bi bi-circle-fill" style="font-size:0.45rem;opacity:0.4;flex-shrink:0"></i>
                <span style="flex:1">${lesson.title}</span>
                <span class="lesson-check"><i class="bi bi-circle"></i></span>
            </div>`;
        }).join('');
        chDiv.innerHTML = `
            <div class="chapter-title open" onclick="toggleChapter(this)">
                <i class="bi bi-chevron-right"></i>${chapter.title}
            </div>
            <div class="chapter-lessons">
                ${lessonsHTML}
                <button class="quiz-btn" id="quiz-btn-${chapter.id}" onclick="loadQuiz(${chapter.id})">
                    <i class="bi bi-patch-question-fill"></i> Take Chapter Quiz
                </button>
            </div>`;
        sidebar.appendChild(chDiv);
    });
    if (allLessons.length > 0) loadLesson(0);
}

function toggleChapter(el) {
    el.classList.toggle('open');
    const lessons = el.nextElementSibling;
    lessons.style.display = lessons.style.display === 'none' ? 'block' : 'none';
}

function loadLesson(idx) {
    currentLessonIndex = idx;
    const lesson = allLessons[idx];
    document.querySelectorAll('.lesson-item').forEach(el => el.classList.remove('active'));
    const activeEl = document.getElementById(`lesson-item-${idx}`);
    if (activeEl) activeEl.classList.add('active');
    document.getElementById('current-lesson-title').textContent = lesson.title;

    const isCompleted = completedLessons.has(lesson.id);
    const codeBlock = lesson.code_example ? `
        <div class="code-block">
            <span class="code-label">Example</span>
            <button class="copy-btn" onclick="copyCode(this)">Copy</button>
            <pre>${escapeHtml(lesson.code_example)}</pre>
        </div>` : '';

    const prevBtn = idx > 0 ? `<button class="lesson-nav-btn" onclick="loadLesson(${idx-1})"><i class="bi bi-arrow-left"></i> Previous</button>` : '<div></div>';
    const nextBtn = idx < allLessons.length - 1 ? `<button class="lesson-nav-btn primary-btn" onclick="loadLesson(${idx+1})">Next <i class="bi bi-arrow-right"></i></button>` : '<div></div>';

    const markBtn = isCompleted
        ? `<button class="mark-complete-btn completed" disabled><i class="bi bi-check-circle-fill"></i> Completed</button>`
        : `<button class="mark-complete-btn" onclick="markComplete(${lesson.id}, this)"><i class="bi bi-check-circle"></i> Mark Complete</button>`;

    document.getElementById('lessonContent').innerHTML = `
        <div class="lesson-body">
            <h1>${lesson.title}</h1>
            <div>${lesson.content.replace(/\n/g,'<br>')}</div>
            ${codeBlock}
            <div class="lesson-nav">${prevBtn}${markBtn}${nextBtn}</div>
        </div>`;
}

async function markComplete(lessonId, btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Saving...';

    const res = await fetch('/mark_lesson_complete/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
        body: JSON.stringify({ username: getUsername(), lesson_id: lessonId, course_id: courseId })
    });
    const data = await res.json();

    completedLessons.add(lessonId);
    updateProgressUI(data.percentage);
    updateLessonChecks();

    btn.className = 'mark-complete-btn completed';
    btn.innerHTML = '<i class="bi bi-check-circle-fill"></i> Completed';

    if (data.course_complete && data.certificate_id) {
        _certId = data.certificate_id;
        document.getElementById('certBtn').style.display = 'flex';
        showCompletionBanner(data.certificate_id);
    }
}

function showCompletionBanner(certId) {
    const area = document.getElementById('lessonContent');
    const banner = document.createElement('div');
    banner.className = 'completion-banner';
    banner.innerHTML = `
        <div>
            <h3>🎉 Course Completed!</h3>
            <p>Congratulations! You have completed all lessons.</p>
        </div>
        <button class="view-cert-btn" onclick="showCertificate()">
            <i class="bi bi-award-fill"></i> View Certificate
        </button>`;
    area.insertBefore(banner, area.firstChild);
}

async function showCertificate() {
    if (!_certId) return;
    const res = await fetch(`/get_certificate/?cert_id=${_certId}`);
    const data = await res.json();
    if (data.status !== 'ok') return;

    document.getElementById('certContent').innerHTML = `
        <div class="certificate-wrap">
            <div class="cert-logo">🏆</div>
            <div class="cert-label">Certificate of Completion</div>
            <div class="cert-title">E-Learning Platform</div>
            <div class="cert-sub">This is to certify that</div>
            <div class="cert-name">${data.student_name}</div>
            <div class="cert-course-label">has successfully completed</div>
            <div class="cert-course">${data.course_name}</div>
            <div class="cert-divider"></div>
            <div class="cert-meta">
                <div class="cert-meta-item">
                    <div class="cert-meta-label">Issue Date</div>
                    <div class="cert-meta-value">${data.issued_at}</div>
                </div>
                <div class="cert-meta-item">
                    <div class="cert-meta-label">Certificate ID</div>
                    <div class="cert-meta-value" style="font-size:0.75rem">${data.certificate_id}</div>
                </div>
                <div class="cert-meta-item">
                    <div class="cert-meta-label">Status</div>
                    <div class="cert-meta-value" style="color:#10b981">✓ Verified</div>
                </div>
            </div>
        </div>
        <div class="cert-actions">
            <button class="cert-download-btn" onclick="printCertificate()">
                <i class="bi bi-download"></i> Download / Print
            </button>
            <button class="cert-close-btn2" onclick="closeCertificate()">Close</button>
        </div>`;

    document.getElementById('certModal').classList.add('active');
}

function printCertificate() {
    const content = document.querySelector('.certificate-wrap').outerHTML;
    const win = window.open('', '_blank');
    win.document.write(`
        <html><head><title>Certificate</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap');
            * { margin:0; padding:0; box-sizing:border-box; }
            body { font-family: 'Inter', sans-serif; }
            :root { --font-display: 'Space Grotesk', sans-serif; }
            ${document.querySelector('style').textContent}
        </style></head>
        <body>${content}<script>window.onload=function(){window.print();}<\/script></body></html>`);
    win.document.close();
}

function closeCertificate() { document.getElementById('certModal').classList.remove('active'); }
function handleCertModalClick(e) { if (e.target === document.getElementById('certModal')) closeCertificate(); }

async function loadQuiz(chapterId) {
    const uname = getUsername();
    const res = await fetch(`/get_quiz/?chapter_id=${chapterId}&username=${uname}`);
    const data = await res.json();
    if (!data.has_quiz) { alert('No quiz available for this chapter yet!'); return; }
    _quizData = data; _quizAnswers = {};
    if (data.already_passed) { showQuizAlreadyPassed(data); }
    else { showQuizQuestions(data); }
    document.getElementById('quizModal').classList.add('active');
}

function showQuizAlreadyPassed(data) {
    document.getElementById('quizContent').innerHTML = `
        <div class="quiz-result passed">
            <div class="quiz-result-emoji">🏆</div>
            <div class="quiz-result-score">✓</div>
            <div class="quiz-result-msg">Already Passed!</div>
            <div class="quiz-result-sub">You have already passed this quiz.</div>
            <div class="quiz-result-btns">
                <button class="quiz-close-btn" onclick="closeQuiz()">Close</button>
                <button class="quiz-retry-btn" onclick="showQuizQuestions(_quizData)">Retake Quiz</button>
            </div>
        </div>`;
}

function showQuizQuestions(data) {
    _quizAnswers = {};
    const total = data.questions.length;
    let html = `
        <div class="quiz-header">
            <h2>📝 ${data.title}</h2>
            <p>${total} question${total > 1 ? 's' : ''} &nbsp;•&nbsp; Pass mark: ${data.pass_percentage}%</p>
        </div>
        <div class="quiz-progress"><div class="quiz-progress-bar" id="quizProgressBar" style="width:0%"></div></div>`;
    data.questions.forEach((q, i) => {
        html += `
        <div class="quiz-question">
            <div class="quiz-q-text">Q${i+1}. ${q.text}</div>
            <div class="quiz-options">
                ${['A','B','C','D'].map(opt => `
                    <button class="quiz-option" onclick="selectOption(this, ${q.id}, '${opt}', ${total})" data-qid="${q.id}" data-opt="${opt}">
                        <span class="quiz-opt-letter">${opt}</span>${q.options[opt]}
                    </button>`).join('')}
            </div>
        </div>`;
    });
    html += `<button class="quiz-submit-btn" onclick="submitQuiz()">Submit Quiz &nbsp;<i class="bi bi-arrow-right"></i></button>`;
    document.getElementById('quizContent').innerHTML = html;
}

function selectOption(el, qid, opt, total) {
    document.querySelectorAll(`.quiz-option[data-qid="${qid}"]`).forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    _quizAnswers[qid] = opt;
    const bar = document.getElementById('quizProgressBar');
    if (bar) bar.style.width = Math.round((Object.keys(_quizAnswers).length / total) * 100) + '%';
}

async function submitQuiz() {
    if (!_quizData) return;
    const total = _quizData.questions.length;
    const answered = Object.keys(_quizAnswers).length;
    if (answered < total) { if (!confirm(`You have ${total - answered} unanswered question(s). Submit anyway?`)) return; }
    const currentUsername = getUsername();
    try {
        const res = await fetch('/submit_quiz/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
            body: JSON.stringify({ quiz_id: _quizData.quiz_id, username: currentUsername, answers: _quizAnswers })
        });
        if (!res.ok) { const err = await res.json(); alert('Error: ' + JSON.stringify(err)); return; }
        const data = await res.json();
        showQuizResult(data);
        if (data.passed) {
            const btn = document.getElementById(`quiz-btn-${_quizData.quiz_id}`);
            if (btn) { btn.classList.add('passed'); btn.innerHTML = '<i class="bi bi-check-circle-fill"></i> Quiz Passed ✓'; }
        }
    } catch(e) { alert('Network error: ' + e.message); }
}

function showQuizResult(data) {
    const passed = data.passed;
    let reviewHTML = '';
    data.results.forEach((r, i) => {
        reviewHTML += `
        <div class="quiz-question">
            <div class="quiz-q-text">Q${i+1}. ${r.question}</div>
            <div class="quiz-options">
                ${['A','B','C','D'].map(opt => {
                    let cls = '';
                    if (opt === r.correct_answer) cls = 'correct';
                    else if (opt === r.your_answer && !r.is_correct) cls = 'wrong';
                    return `<div class="quiz-option ${cls}" style="cursor:default">
                        <span class="quiz-opt-letter">${opt}</span>${r.options[opt]}
                        ${opt === r.correct_answer ? '<i class="bi bi-check-circle-fill" style="margin-left:auto;color:#10b981"></i>' : ''}
                        ${opt === r.your_answer && !r.is_correct ? '<i class="bi bi-x-circle-fill" style="margin-left:auto;color:#ef4444"></i>' : ''}
                    </div>`;
                }).join('')}
            </div>
        </div>`;
    });
    document.getElementById('quizContent').innerHTML = `
        <div class="quiz-result ${passed ? 'passed' : 'failed'}">
            <div class="quiz-result-emoji">${passed ? '🎉' : '😔'}</div>
            <div class="quiz-result-score">${data.percentage}%</div>
            <div class="quiz-result-msg">${passed ? 'Congratulations! You Passed!' : 'Keep trying!'}</div>
            <div class="quiz-result-sub">${data.score} / ${data.total} correct &nbsp;•&nbsp; Pass mark: ${data.pass_percentage}%</div>
            <div class="quiz-result-btns">
                <button class="quiz-close-btn" onclick="closeQuiz()">Close</button>
                <button class="quiz-retry-btn" onclick="showQuizQuestions(_quizData)"><i class="bi bi-arrow-repeat"></i> Retry</button>
            </div>
        </div>
        <div class="review-section"><div class="review-title">📊 Answer Review</div>${reviewHTML}</div>`;
}

function closeQuiz() { document.getElementById('quizModal').classList.remove('active'); }
function handleModalClick(e) { if (e.target === document.getElementById('quizModal')) closeQuiz(); }
function copyCode(btn) {
    navigator.clipboard.writeText(btn.nextElementSibling.textContent);
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 2000);
}
function escapeHtml(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toggleSidebar() { document.getElementById('learnSidebar').classList.toggle('open'); }
function getCookie(name) {
    let val = null;
    document.cookie.split(';').forEach(c => {
        const t = c.trim();
        if (t.startsWith(name + '=')) val = decodeURIComponent(t.slice(name.length + 1));
    });
    return val;
}
</script>
{% endblock %}
