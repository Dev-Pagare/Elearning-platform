{% extends 'nav.html' %}
{% load static %}
{% block content %}
<div class="auth-page">
    <div class="auth-bg-shapes">
        <div class="shape shape-1"></div><div class="shape shape-2"></div><div class="shape shape-3"></div>
    </div>
    <div class="auth-container wide">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon-wrap"><i class="bi bi-person-plus"></i></div>
                <h2 class="auth-title">Create Account</h2>
                <p class="auth-subtitle">Join thousands of learners today</p>
            </div>
            <form class="auth-form" id="register-form">
                <div class="form-row-two">
                    <div class="form-group-custom">
                        <label class="form-label-custom">Full Name</label>
                        <div class="input-wrap"><i class="bi bi-person input-icon"></i>
                        <input type="text" class="form-control-custom" id="name" name="name" placeholder="Your full name"></div>
                    </div>
                    <div class="form-group-custom">
                        <label class="form-label-custom">Email Address</label>
                        <div class="input-wrap"><i class="bi bi-envelope input-icon"></i>
                        <input type="email" class="form-control-custom" id="email" name="email" placeholder="you@email.com"></div>
                    </div>
                </div>
                <div class="form-row-two">
                    <div class="form-group-custom">
                        <label class="form-label-custom">Username</label>
                        <div class="input-wrap"><i class="bi bi-at input-icon"></i>
                        <input type="text" class="form-control-custom" id="username" name="username" placeholder="Choose a username"></div>
                    </div>
                    <div class="form-group-custom">
                        <label class="form-label-custom">Address</label>
                        <div class="input-wrap"><i class="bi bi-geo-alt input-icon"></i>
                        <input type="text" class="form-control-custom" id="address" name="address" placeholder="Your address"></div>
                    </div>
                </div>
                <div class="form-row-two">
                    <div class="form-group-custom">
                        <label class="form-label-custom">Phone Number</label>
                        <div class="input-wrap"><i class="bi bi-telephone input-icon"></i>
                        <input type="text" class="form-control-custom" id="number" name="number" placeholder="0123456789"></div>
                    </div>
                    <div class="form-group-custom">
                        <label class="form-label-custom">Password</label>
                        <div class="input-wrap"><i class="bi bi-lock input-icon"></i>
                        <input type="password" class="form-control-custom" id="password" name="password" placeholder="Create a password">
                        <button type="button" class="toggle-password" onclick="togglePwd('password',this)"><i class="bi bi-eye"></i></button></div>
                    </div>
                </div>
                <button type="submit" class="btn btn-auth"><span>Create Account</span><i class="bi bi-arrow-right ms-2"></i></button>
            </form>
            <p id="message" class="auth-message"></p>
            <p class="auth-switch">Already have an account? <a href="{% url 'login_page' %}">Sign in now</a></p>
        </div>
    </div>
</div>
<script>
if(localStorage.getItem('token')) window.location.href="{% url 'index' %}";
function togglePwd(id,btn){const f=document.getElementById(id),i=btn.querySelector('i');f.type=f.type==='password'?'text':'password';i.className=f.type==='text'?'bi bi-eye-slash':'bi bi-eye';}
document.getElementById('register-form').addEventListener('submit',function(e){
    e.preventDefault();
    const btn=this.querySelector('.btn-auth'),msg=document.getElementById('message');
    btn.innerHTML='<span class="spinner-border spinner-border-sm me-2"></span>Creating...';btn.disabled=true;
    fetch('/signup/',{method:'POST',body:new FormData(e.target)})
    .then(r=>r.json()).then(d=>{
        if(d.status==='success'){localStorage.setItem('token',d.token);window.location.href="{% url 'index' %}";}
        else{msg.textContent=d.status==='student already exists'?'Username already taken.':'Registration failed.';msg.className='auth-message error';document.querySelector('.auth-card').classList.add('shake');setTimeout(()=>document.querySelector('.auth-card').classList.remove('shake'),500);btn.innerHTML='<span>Create Account</span><i class="bi bi-arrow-right ms-2"></i>';btn.disabled=false;}
    }).catch(()=>{msg.textContent='Network error.';msg.className='auth-message error';btn.innerHTML='<span>Create Account</span><i class="bi bi-arrow-right ms-2"></i>';btn.disabled=false;});
});
</script>
{% endblock %}
