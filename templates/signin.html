{% extends 'nav.html' %}
{% load static %}
{% block content %}
<div class="auth-page">
    <div class="auth-bg-shapes">
        <div class="shape shape-1"></div><div class="shape shape-2"></div><div class="shape shape-3"></div>
    </div>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon-wrap"><i class="bi bi-shield-lock"></i></div>
                <h2 class="auth-title">Welcome Back</h2>
                <p class="auth-subtitle">Sign in to continue your learning journey</p>
            </div>
            <form class="auth-form" id="login-form">
                <div class="form-group-custom">
                    <label class="form-label-custom">Username</label>
                    <div class="input-wrap">
                        <i class="bi bi-person input-icon"></i>
                        <input type="text" class="form-control-custom" id="username" name="username" placeholder="Enter your username">
                    </div>
                </div>
                <div class="form-group-custom">
                    <label class="form-label-custom">Password</label>
                    <div class="input-wrap">
                        <i class="bi bi-lock input-icon"></i>
                        <input type="password" class="form-control-custom" id="password" name="password" placeholder="Enter your password">
                        <button type="button" class="toggle-password" onclick="togglePwd('password',this)"><i class="bi bi-eye"></i></button>
                    </div>
                </div>
                <button type="submit" class="btn btn-auth"><span>Sign In</span><i class="bi bi-arrow-right ms-2"></i></button>
            </form>
            <p id="message" class="auth-message"></p>
            <p class="auth-switch">Don't have an account? <a href="{% url 'signup_page' %}">Sign up now</a></p>
        </div>
    </div>
</div>
<script>
if(localStorage.getItem('token')) window.location.href="{% url 'index' %}";
function togglePwd(id,btn){const f=document.getElementById(id),i=btn.querySelector('i');f.type=f.type==='password'?'text':'password';i.className=f.type==='text'?'bi bi-eye-slash':'bi bi-eye';}
document.getElementById('login-form').addEventListener('submit',function(e){
    e.preventDefault();
    const btn=this.querySelector('.btn-auth'),msg=document.getElementById('message');
    btn.innerHTML='<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';btn.disabled=true;
    fetch('/login/',{method:'POST',body:new FormData(e.target)})
    .then(r=>r.json()).then(d=>{
        if(d.status==='success'){localStorage.setItem('token',d.token);window.location.href="{% url 'index' %}";}
        else{msg.textContent='Invalid username or password.';msg.className='auth-message error';document.querySelector('.auth-card').classList.add('shake');setTimeout(()=>document.querySelector('.auth-card').classList.remove('shake'),500);btn.innerHTML='<span>Sign In</span><i class="bi bi-arrow-right ms-2"></i>';btn.disabled=false;}
    }).catch(()=>{msg.textContent='Network error.';msg.className='auth-message error';btn.innerHTML='<span>Sign In</span><i class="bi bi-arrow-right ms-2"></i>';btn.disabled=false;});
});
</script>
{% endblock %}
